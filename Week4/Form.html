<!DOCTYPE html>
<html>
<head>
    <title>Tech Club Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tech Club Registration">
    <meta name="keywords" content="Tech Club, HTML">
    <meta name="author" content="Your Name">

    <link rel="icon" href="favicon.ico">
</head>
<body>
    <hr>

<h2>Tech Club Events</h2>

<table border="1">

    <thead>
        <tr>
            <th>Event ID</th>
            <th>Event Name</th>
            <th>Date</th>
            <th>Venue</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>101</td>
            <td>Web Development Workshop</td>
            <td>10-Nov-2026</td>
            <td>Computer Lab</td>
        </tr>

        <tr>
            <td>102</td>
            <td>AI Seminar</td>
            <td>15-Nov-2026</td>
            <td>Seminar Hall</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Hackathon</td>
            <td>20-Nov-2026</td>
            <td>Auditorium</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="4">Total Events: 3</td>
        </tr>
    </tfoot>

</table>

    <h1>Tech Club Registration Form</h1>

    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">

        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="gender">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>

        <br><br>

        <label>Skills:</label>

        <input type="checkbox" id="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="js">
        <label for="js">JavaScript</label>

        <br><br>

        <label for="course">Course:</label>

        <select id="course">
            <option>BCA</option>
            <option>B.Tech</option>
            <option>MCA</option>
            <option>M.Tech</option>
        </select>

        <br><br>

        <label for="message">Message:</label>

        <textarea id="message" rows="5" cols="30"></textarea>

        <br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
