<!DOCTYPE html>
<html>
<head>
    <title>Tech Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background-color:#f2f4fa;
    font-family:'Poppins', sans-serif; /* Google Font */
    line-height:1.6; /* Line Height */
    padding:20px;
}

#hero{
    background-color:#3659e3; /* Color */
    color:white; /* Color */
    text-align:center;
    padding:40px;
    border-radius:10px;
    margin-bottom:20px;
}

h1{
    font-size:40px; /* Font Size */
}

.card{
    background-color:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

h2{
    color:#333;
    font-size:28px;
}

p{
    font-size:16px;
}

    </style>

</head>
<body>

    <div id="hero">
        <h1>Tech Club</h1>
        <p>Learn. Code. Grow.</p>
    </div>

    <div class="card">
        <h2>Upcoming Events</h2>

        <table>
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>

            <tr>
                <td>HTML Workshop</td>
                <td>12 Nov</td>
                <td>Lab 1</td>
            </tr>

            <tr>
                <td>Hackathon</td>
                <td>20 Nov</td>
                <td>Seminar Hall</td>
            </tr>
        </table>
    </div>

    <div class="card">
        <h2>Register</h2>

        <form>
            Name:
            <input type="text" placeholder="Your name">
            <br><br>

            Email:
            <input type="email" placeholder="you@example.com">
            <br><br>

            <button>Register</button>
        </form>
    </div>

</body>
</html>
