<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 6.1 - Box Model</title>

<style>
/* box-sizing */
*{
    box-sizing: border-box;
}

body{
    font-family: Arial, sans-serif;
}

/* Box Model Example */
.box{
    width: 300px;
    height: 150px;

    padding: 20px;          /* Inside Space */
    border: 5px solid blue; /* Border */
    margin: 50px;           /* Outside Space */

    background-color: lightblue;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 20px;
}
</style>

</head>
<body>

<div class="box">
    Box Model Example
</div>

</body>
</html>
